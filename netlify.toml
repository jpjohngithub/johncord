# Netlify - JohnCord 2.0
[build]
  base = "frontend"
  publish = "dist"
  command = "node build.js"

# Redireciona tudo para index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de seguranca
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

