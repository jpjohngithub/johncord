<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JohnCord</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
</head>
<body>

<!-- TELA DE LOGIN -->
<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">🎮 JohnCord</div>
    <div class="auth-sub">Converse e faça call com seus amigos</div>
    <div id="authError" class="auth-error" style="display:none"></div>
    <div class="auth-server-badge" id="authServerBadge">
      <span class="dot-indicator" id="statusDot"></span>
      <span id="statusText">Conectando ao servidor...</span>
      <button id="btnConfigServer" class="server-change-btn" type="button">⚙️ Configurar</button>
    </div>
    <input id="authUser" class="input" placeholder="Nome de usuário" maxlength="20" autocomplete="username">
    <input id="authPass" type="password" class="input" placeholder="Senha" autocomplete="current-password">
    <button id="btnLogin" class="btn btn-primary">Entrar</button>
    <button id="btnRegister" class="btn btn-ghost">Criar conta</button>
    <div class="auth-hint">Sem conta? Crie uma em segundos!</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none">

  <!-- BARRA DE SERVIDORES -->
  <nav class="rail">
    <div class="rail-home" id="btnHome" title="Amigos / Mensagens diretas">
      <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M20.3 4.4A16.9 16.9 0 0 0 16 3l-.2.4c1.5.4 2.8 1 4 1.8A13.7 13.7 0 0 0 12 3.6c-2.7 0-5.3.6-7.8 1.7 1.2-.8 2.6-1.5 4-1.9L8 3a17 17 0 0 0-4.3 1.3C1.6 8.5 1 12.5 1.3 16.4A17 17 0 0 0 6.5 19l1.1-1.6c-.8-.3-1.6-.7-2.3-1.2l.6-.4a12 12 0 0 0 10.2 0l.6.4c-.7.5-1.5.9-2.3 1.2L15.5 19a17 17 0 0 0 5.2-2.6c.4-4.5-.7-8.5-3.4-12ZM8.7 14.2c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/></svg>
    </div>
    <div class="rail-sep"></div>
    <div id="serverList" class="rail-servers"></div>
    <button id="btnAddServer" class="rail-add" title="Adicionar um servidor">+</button>
  </nav>

  <!-- SIDEBAR DE CANAIS OU HOME -->
  <aside class="sidebar">
    <header class="sidebar-header" id="sidebarHeader">JohnCord</header>
    <div id="channelView" class="sidebar-body"></div>
    <div id="userPanel" class="user-panel">
      <div class="user-avatar" id="myAvatar">?</div>
      <div class="user-info">
        <span id="myName">...</span>
        <small id="myStatus">#0000</small>
      </div>
      <button id="btnMute" title="Silenciar microfone" class="icon-btn">🎤</button>
      <button id="btnDisconnectVoice" title="Desconectar da call" class="icon-btn" style="display:none">📞</button>
      <button id="btnSettings" title="Configurações / Servidor" class="icon-btn">⚙️</button>
    </div>
  </aside>

  <!-- ÁREA PRINCIPAL -->
  <main class="main">
    <header class="main-header">
      <span id="chanIcon" class="chan-icon">#</span>
      <span id="chanName">geral</span>
      <div class="header-actions">
        <button id="btnInvite" class="btn btn-small btn-primary" title="Convidar pessoas">👥 Convidar</button>
        <button id="btnMembers" class="btn btn-small btn-ghost" title="Membros">Membros</button>
      </div>
    </header>
    <div class="main-body">
      <div class="chat-wrap">
        <div id="messages" class="messages"></div>
        <div id="typingIndicator" class="typing-indicator"></div>
        <div class="composer-wrap">
          <div class="composer">
            <textarea id="msgInput" rows="1" placeholder="Enviar mensagem..." maxlength="2000"></textarea>
            <button id="btnSend" class="send-btn">➤</button>
          </div>
        </div>
      </div>
      <aside id="memberList" class="member-list"></aside>
    </div>
  </main>
</div>

<!-- MODAIS -->
<div id="modalOverlay" class="modal-overlay" style="display:none">
  <div class="modal" id="modalBox"></div>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
